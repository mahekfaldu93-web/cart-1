<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <h1>Cart</h1>

  <div class="dashboard-layout">

    <div class="left-sidebar">
      <h2 id="formTitle">Add Product</h2>
      <form id="productForm" class="vertical-form">
        <div class="form-group">
          <label for="title">Product Name</label>
          <input type="text" id="title" placeholder="Product Name" required>
        </div>

        <div class="form-group">
          <label for="price">Price</label>
          <input type="number" id="price" placeholder="Price" required>
        </div>

        <div class="form-group">
          <label for="image">Image URL</label>
          <input type="url" id="image" placeholder="Image URL" required>
        </div>

        <!-- <div class="form-group">
          <label for="category">Select Category</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Mobile">Mobile</option>
            <option value="Laptop">Laptop</option>
            <option value="Camera">Camera</option>
            <option value="Watch">Watch</option>
            <option value="Shoes">Shoes</option>
            <option value="Clothes">Clothes</option>
            <option value="Speaker">Speaker</option>
            <option value="Headphones">Headphones</option>
            <option value="Buds">Buds</option>
            <option value="Mouse">Mouse</option>
            <option value="Power Bank">Power Bank</option>
          </select>
        </div> -->

        <button type="submit" id="submitBtn" class="btn-submit">Add Product</button>
      </form>
    </div>

    <div class="right-content">
      <div class="search-panel">
        <div class="controls-grid">
          <input type="text" id="search" placeholder="Search Product">
          <select id="sort">
            <option value="default">Sort</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>        
        </div>
      </div>

     
      <div id="productList" class="products-grid">
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
